<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: #fff6f2;
    background: radial-gradient(900px 400px at 85% -10%, rgba(255,255,255,.15), transparent 60%), linear-gradient(160deg, #7d1200, #b51a00);
    display: flex; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box;
  }
  .copy { flex: 1; }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
  h1 { font-size: 76px; line-height: 1.05; margin: 16px 0 18px; letter-spacing: -.02em; }
  p { font-size: 28px; line-height: 1.35; margin: 0; opacity: .9; }
  .card {
    width: 340px; background: #fffdfb; color: #1b1917; border-radius: 34px; text-align: center; padding: 34px 0 36px;
    box-shadow: 0 30px 60px rgba(40,5,0,.35);
  }
  .card .label { font-weight: 800; letter-spacing: .5em; text-indent: .5em; color: #b51a00; font-size: 28px; }
  .card .num { font: 900 190px/1 ui-rounded, "SF Pro Rounded", sans-serif; letter-spacing: -.04em; }
  .card .sub { color: #6a635c; font-size: 24px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow">iPhone · iPad · Apple Watch</div>
    <h1>Hvilken uke er det?</h1>
    <p>Ukenummeret på app-ikonet, i widgets, i Kontrollsenter og på Apple Watch.</p>
  </div>
  <div class="card"><div class="label">UKE</div><div class="num">40</div><div class="sub">Ukenummer</div></div>
</body>
</html>
